services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: desaymem-postgres
    environment:
      POSTGRES_USER: desaymem
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: desaymem
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desaymem -d desaymem"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desaymem-api
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://desaymem:change_me@postgres:5432/desaymem
      HISTORY_DB_PATH: /app/data/history.db
    volumes:
      - history_data:/app/data
    ports:
      - "127.0.0.1:8766:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    restart: unless-stopped

volumes:
  postgres_data:
  history_data:


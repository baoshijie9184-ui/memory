[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desaymem-light"
version = "0.1.0"
description = "Pluggable, cloud-oriented vehicle memory service"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7.3,<3.0",
    "pydantic-settings>=2.4.0,<3.0",
    "PyYAML>=6.0,<7.0",
    "openai>=1.40.0,<3.0",
    "psycopg[binary,pool]>=3.2.0,<4.0",
    "pgvector>=0.3.6,<1.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.6.0",
]
tokenizer = ["transformers>=4.51.0,<6.0"]

[project.scripts]
desaymem-api = "desaymem_light.cli:api_main"
desaymem-migrate = "desaymem_light.cli:migrate_main"
desaymem-worker = "desaymem_light.cli:worker_main"
desaymem-mirror-worker = "desaymem_light.cli:mirror_worker_main"
desaymem-preflight = "desaymem_light.cli:preflight_main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

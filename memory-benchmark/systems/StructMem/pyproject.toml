[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structmem"
version = "0.1.0"
description = "StructMem: structured hierarchical memory (LightMem event mode) on the benchmark unified storage stack"
requires-python = ">=3.10,<3.12"
dependencies = [
    "openai>=1.30",
    "httpx>=0.27",
    "pydantic>=2.5",
    "psycopg[binary,pool]>=3.1",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
